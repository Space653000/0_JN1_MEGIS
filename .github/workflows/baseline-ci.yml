name: Baseline CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked Windows baseline
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}\.cache\pip
      npm_config_cache: ${{ github.workspace }}\.cache\npm
      TEMP: ${{ github.workspace }}\.temp
      TMP: ${{ github.workspace }}\.temp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.9
          cache: ''

      - name: Set up Node.js 24.17.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Create repository-local runtime directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .cache\pip, .cache\npm, .temp, .tools\npm | Out-Null

      - name: Create repository-local Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --cache-dir .cache\pip pip==26.2.1
          .\.venv\Scripts\python.exe -m pip install --cache-dir .cache\pip --requirement requirements.lock

      - name: Install repository-local npm CLI and dependencies
        shell: pwsh
        run: |
          npm install --prefix .tools\npm --cache .cache\npm --no-save npm@11.13.0
          node .tools\npm\node_modules\npm\bin\npm-cli.js --prefix apps\web ci --cache .cache\npm

      - name: Run baseline verification
        shell: pwsh
        run: .\scripts\run-baseline-ci.ps1 -PythonExecutable .\.venv\Scripts\python.exe -NpmCli .tools\npm\node_modules\npm\bin\npm-cli.js
